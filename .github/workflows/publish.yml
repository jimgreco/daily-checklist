name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_server:
        description: Deploy only Ritual Cue after coordinated host approval and live configuration preflight
        required: true
        type: boolean
        default: false
      publish_testflight:
        description: Upload only iOS to the approved existing Jim-only internal group
        required: true
        type: boolean
        default: false
      update_app_store_metadata:
        description: Upload source-controlled App Store listing metadata to the editable version
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      update_app_store_screenshots:
        description: Generate screenshots and replace screenshots on the editable App Store version
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      submit_for_review:
        description: Attach review_build to the editable App Store version (with source metadata) and submit it for review
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      review_build:
        description: Exact uploaded build number to submit for review, e.g. 152
        required: false
        type: string
      review_release:
        description: After approval, release automatically or wait for a manual release
        required: true
        type: choice
        default: manual
        options:
          - manual
          - automatic
      app_store_version:
        description: Optional App Store version override; defaults to Xcode MARKETING_VERSION
        required: false
        type: string
      screenshot_devices:
        description: Comma-separated simulator names for screenshot capture
        required: true
        type: string
        default: "iPhone 17 Pro Max,iPad Pro 13-inch (M5)"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Test server
        working-directory: server
        run: npm test

      - name: Test workflow SSH formatting and backup retention controls
        run: python3 -m unittest discover -s server/test -p 'test_database_backup.py'

      - name: Audit production dependencies
        working-directory: server
        run: npm audit --omit=dev

      - name: Build server image
        run: docker build -t daily-server-ci server

  deploy-server:
    # Every push to main releases the server; manual runs release only when asked.
    # Builds the exact-commit ARM64 image, pushes it to GHCR and replaces only the
    # `daily` service on the shared host via release-tools (see docs/server-release.md).
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_server) }}
    needs: verify-server
    permissions:
      contents: read
      packages: write
    uses: jimgreco/release-tools/.github/workflows/server-release.yml@ff61f1c6a6eb51ea982246473203bcc903ce8153
    with:
      tools_ref: ff61f1c6a6eb51ea982246473203bcc903ce8153
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}

  app-store-assets:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.update_app_store_metadata == 'true' || inputs.update_app_store_screenshots == 'true' || inputs.submit_for_review == 'true') }}
    runs-on: macos-latest
    environment: production
    timeout-minutes: 45
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Validate App Store Connect configuration
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY; do
            test -n "${!name}" || { echo "Missing required secret: $name"; exit 1; }
          done

      - name: Select Xcode
        run: |
          set -euo pipefail
          for path in /Applications/Xcode_26.2.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode.app; do
            if [ -d "$path" ]; then
              sudo xcode-select -s "$path/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Fastlane
        run: bundle install

      - name: Generate App Store screenshots
        if: ${{ inputs.update_app_store_screenshots == 'true' }}
        env:
          SCREENSHOT_DEVICES: ${{ inputs.screenshot_devices }}
        run: bundle exec fastlane ios screenshots

      - name: Upload screenshot artifact
        if: ${{ inputs.update_app_store_screenshots == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: fastlane/screenshots
          if-no-files-found: error

      - name: Upload App Store metadata
        if: ${{ inputs.update_app_store_metadata == 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_VERSION: ${{ inputs.app_store_version }}
        run: bundle exec fastlane ios upload_metadata

      - name: Upload App Store screenshots
        if: ${{ inputs.update_app_store_screenshots == 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_VERSION: ${{ inputs.app_store_version }}
        run: bundle exec fastlane ios upload_screenshots

      - name: Submit build for App Store review
        if: ${{ inputs.submit_for_review == 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_VERSION: ${{ inputs.app_store_version }}
          REVIEW_BUILD: ${{ inputs.review_build }}
          REVIEW_RELEASE: ${{ inputs.review_release }}
        run: bundle exec fastlane ios submit_review

  testflight:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_testflight)) && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - name: Select Xcode
      run: |
        set -euo pipefail
        for path in /Applications/Xcode_26.2.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode.app; do
          if [ -d "$path" ]; then
            sudo xcode-select -s "$path/Contents/Developer"
            break
          fi
        done
        xcodebuild -version
    - name: Prepare iOS simulator
      id: simulator
      run: |
        set -euo pipefail

        simulator_sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
        echo "iPhoneSimulator SDK version: $simulator_sdk_version"
        if ! xcrun simctl list runtimes | grep -q "iOS $simulator_sdk_version"; then
          echo "Matching iOS simulator runtime is missing; downloading iOS platform."
          sudo xcodebuild -downloadPlatform iOS
        fi
        export SIMULATOR_SDK_VERSION="$simulator_sdk_version"

        runtime=$(xcrun simctl list runtimes --json | ruby -rjson -e '
          def version_key(value)
            value.to_s.scan(/\d+/).map(&:to_i)
          end

          runtimes = JSON.parse(STDIN.read).fetch("runtimes").select do |candidate|
            candidate["isAvailable"] && candidate["platform"] == "iOS"
          end
          matching = runtimes.select do |candidate|
            candidate["version"].to_s == ENV.fetch("SIMULATOR_SDK_VERSION")
          end
          selected = matching.max_by { |candidate| version_key(candidate["version"]) }
          selected ||= runtimes.max_by { |candidate| version_key(candidate["version"]) }
          abort("No available iOS simulator runtime found") unless selected
          puts selected.fetch("identifier")
        ')

        device_type=$(xcrun simctl list devicetypes --json | ruby -rjson -e '
          types = JSON.parse(STDIN.read).fetch("devicetypes").select do |candidate|
            candidate["name"].to_s.include?("iPhone")
          end
          preferred = [
            "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro",
            "com.apple.CoreSimulator.SimDeviceType.iPhone-17",
            "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro",
            "com.apple.CoreSimulator.SimDeviceType.iPhone-16",
            "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro",
            "com.apple.CoreSimulator.SimDeviceType.iPhone-15"
          ]
          selected = preferred.map do |identifier|
            types.find { |candidate| candidate["identifier"] == identifier }
          end.compact.first
          selected ||= types.reverse.find { |candidate| candidate["name"].to_s.include?("Pro") }
          selected ||= types.last
          abort("No iPhone simulator device type found") unless selected
          puts selected.fetch("identifier")
        ')

        udid=$(xcrun simctl create "Ritual Cue CI" "$device_type" "$runtime")
        xcrun simctl boot "$udid" || true
        xcrun simctl bootstatus "$udid" -b
        echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"
    - name: Validate release configuration
      env:
        API_BASE_URL: ${{ secrets.IOS_API_BASE_URL }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_IOS_REVERSED_CLIENT_ID }}
        CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
        CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      run: |
        set -euo pipefail
        for name in API_BASE_URL GOOGLE_CLIENT_ID GOOGLE_REVERSED_CLIENT_ID CERT_P12 CERT_PASSWORD KEYCHAIN_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY; do
          test -n "${!name}" || { echo "Missing required secret: $name"; exit 1; }
        done
        case "$API_BASE_URL" in
          https://*/*) echo "IOS_API_BASE_URL must not include a path or trailing slash."; exit 1 ;;
          https://*) ;;
          *) echo "IOS_API_BASE_URL must be a production HTTPS origin."; exit 1 ;;
        esac
        [[ "$GOOGLE_CLIENT_ID" != *YOUR_* ]] || exit 1
        [[ "$GOOGLE_REVERSED_CLIENT_ID" == com.googleusercontent.apps.* ]] || exit 1
    - name: Run iOS unit tests
      env:
        API_BASE_URL: ${{ secrets.IOS_API_BASE_URL }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_IOS_REVERSED_CLIENT_ID }}
      run: |
        set -euo pipefail
        xcodebuild \
          -project Daily.xcodeproj \
          -scheme Daily \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination '${{ steps.simulator.outputs.destination }}' \
          CODE_SIGNING_ALLOWED=NO \
          API_BASE_URL="$API_BASE_URL" \
          GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
          GOOGLE_REVERSED_CLIENT_ID="$GOOGLE_REVERSED_CLIENT_ID" \
          test
    - uses: jimgreco/release-tools/ios/prepare@ff61f1c6a6eb51ea982246473203bcc903ce8153
      with:
        policy: .github/scripts/release-policy.json
        app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        dist-cert-p12: ${{ secrets.IOS_DIST_CERT_P12 }}
        dist-cert-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
    # No configure-plist step: Ritual Cue injects its values through build settings.
    - uses: jimgreco/release-tools/ios/upload@ff61f1c6a6eb51ea982246473203bcc903ce8153
      env:
        API_BASE_URL: ${{ secrets.IOS_API_BASE_URL }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_IOS_REVERSED_CLIENT_ID }}
      with:
        project: Daily.xcodeproj
        scheme: Daily
        extra-build-settings: |
          IOS_PROFILE_NAME=@PROFILE_UUID:app@
          IOS_WIDGET_PROFILE_NAME=@PROFILE_UUID:extension@
          GIT_COMMIT_HASH=@GIT_SHA7@
          API_BASE_URL=@ENV:API_BASE_URL@
          GOOGLE_CLIENT_ID=@ENV:GOOGLE_CLIENT_ID@
          GOOGLE_REVERSED_CLIENT_ID=@ENV:GOOGLE_REVERSED_CLIENT_ID@
    - uses: jimgreco/release-tools/ios/cleanup@ff61f1c6a6eb51ea982246473203bcc903ce8153
      if: always()
