name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_server:
        description: Deploy only Ritual Cue after coordinated host approval and live configuration preflight
        required: true
        type: boolean
        default: false
      publish_testflight:
        description: Upload only iOS to the approved existing Jim-only internal group
        required: true
        type: boolean
        default: false
      update_app_store_metadata:
        description: Upload source-controlled App Store listing metadata to the editable version
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      update_app_store_screenshots:
        description: Generate screenshots and replace screenshots on the editable App Store version
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      app_store_version:
        description: Optional App Store version override; defaults to Xcode MARKETING_VERSION
        required: false
        type: string
      screenshot_devices:
        description: Comma-separated simulator names for screenshot capture
        required: true
        type: string
        default: "iPhone 17 Pro Max,iPad Pro 13-inch (M5)"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Test server
        working-directory: server
        run: npm test

      - name: Test isolated deployment guards
        run: python3 -m unittest discover -s server/test -p 'test_deploy_service.py'

      - name: Audit production dependencies
        working-directory: server
        run: npm audit --omit=dev

      - name: Build server image
        run: docker build -t daily-server-ci server

  deploy-server:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_server }}
    needs: verify-server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Validate deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_SSH_KNOWN_HOSTS; do
            test -n "${!name}" || { echo "Missing required secret: $name"; exit 1; }
          done

      - name: Prepare SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s' "$EC2_SSH_KEY" > "$HOME/.ssh/daily"
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/daily" "$HOME/.ssh/known_hosts"

      - name: Transfer server to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          node -e 'require("node:fs").writeFileSync("server/src/deployment.json", JSON.stringify({ buildHash: process.env.GITHUB_SHA, deployedAt: new Date().toISOString() }))'
          ssh -i "$HOME/.ssh/daily" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'mkdir -p "$HOME/daily-checklist/server"'
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/daily -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            --exclude node_modules \
            --exclude data \
            --exclude '.env*' \
            server/ "$EC2_USER@$EC2_HOST:~/daily-checklist/server/"

      - name: Rebuild only Daily with unchanged live configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/daily" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "python3 \"\$HOME/daily-checklist/server/scripts/deploy-service.py\" --release '$GITHUB_SHA'"

  app-store-assets:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.update_app_store_metadata == 'true' || inputs.update_app_store_screenshots == 'true') }}
    runs-on: macos-latest
    environment: production
    timeout-minutes: 45
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Validate App Store Connect configuration
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY; do
            test -n "${!name}" || { echo "Missing required secret: $name"; exit 1; }
          done

      - name: Select Xcode
        run: |
          set -euo pipefail
          for path in /Applications/Xcode_26.2.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode.app; do
            if [ -d "$path" ]; then
              sudo xcode-select -s "$path/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Fastlane
        run: bundle install

      - name: Generate App Store screenshots
        if: ${{ inputs.update_app_store_screenshots == 'true' }}
        env:
          SCREENSHOT_DEVICES: ${{ inputs.screenshot_devices }}
        run: bundle exec fastlane ios screenshots

      - name: Upload screenshot artifact
        if: ${{ inputs.update_app_store_screenshots == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: fastlane/screenshots
          if-no-files-found: error

      - name: Upload App Store metadata
        if: ${{ inputs.update_app_store_metadata == 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_VERSION: ${{ inputs.app_store_version }}
        run: bundle exec fastlane ios upload_metadata

      - name: Upload App Store screenshots
        if: ${{ inputs.update_app_store_screenshots == 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_VERSION: ${{ inputs.app_store_version }}
        run: bundle exec fastlane ios upload_screenshots

  testflight:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_testflight)) && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - name: Select Xcode
      run: |
        set -euo pipefail
        for path in /Applications/Xcode_26.2.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode.app; do
          if [ -d "$path" ]; then
            sudo xcode-select -s "$path/Contents/Developer"
            break
          fi
        done
        xcodebuild -version
    - name: Prepare iOS simulator
      id: simulator
      run: |
        set -euo pipefail

        simulator_sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
        echo "iPhoneSimulator SDK version: $simulator_sdk_version"
        if ! xcrun simctl list runtimes | grep -q "iOS $simulator_sdk_version"; then
          echo "Matching iOS simulator runtime is missing; downloading iOS platform."
          sudo xcodebuild -downloadPlatform iOS
        fi
        export SIMULATOR_SDK_VERSION="$simulator_sdk_version"

        runtime=$(xcrun simctl list runtimes --json | ruby -rjson -e '
          def version_key(value)
            value.to_s.scan(/\d+/).map(&:to_i)
          end

          runtimes = JSON.parse(STDIN.read).fetch("runtimes").select do |candidate|
            candidate["isAvailable"] && candidate["platform"] == "iOS"
          end
          matching = runtimes.select do |candidate|
            candidate["version"].to_s == ENV.fetch("SIMULATOR_SDK_VERSION")
          end
          selected = matching.max_by { |candidate| version_key(candidate["version"]) }
          selected ||= runtimes.max_by { |candidate| version_key(candidate["version"]) }
          abort("No available iOS simulator runtime found") unless selected
          puts selected.fetch("identifier")
        ')

        device_type=$(xcrun simctl list devicetypes --json | ruby -rjson -e '
          types = JSON.parse(STDIN.read).fetch("devicetypes").select do |candidate|
            candidate["name"].to_s.include?("iPhone")
          end
          preferred = [
            "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro",
            "com.apple.CoreSimulator.SimDeviceType.iPhone-17",
            "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro",
            "com.apple.CoreSimulator.SimDeviceType.iPhone-16",
            "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro",
            "com.apple.CoreSimulator.SimDeviceType.iPhone-15"
          ]
          selected = preferred.map do |identifier|
            types.find { |candidate| candidate["identifier"] == identifier }
          end.compact.first
          selected ||= types.reverse.find { |candidate| candidate["name"].to_s.include?("Pro") }
          selected ||= types.last
          abort("No iPhone simulator device type found") unless selected
          puts selected.fetch("identifier")
        ')

        udid=$(xcrun simctl create "Ritual Cue CI" "$device_type" "$runtime")
        xcrun simctl boot "$udid" || true
        xcrun simctl bootstatus "$udid" -b
        echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"
    - name: Validate release configuration
      env:
        API_BASE_URL: ${{ secrets.IOS_API_BASE_URL }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_IOS_REVERSED_CLIENT_ID }}
        CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
        CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      run: |
        set -euo pipefail
        for name in API_BASE_URL GOOGLE_CLIENT_ID GOOGLE_REVERSED_CLIENT_ID CERT_P12 CERT_PASSWORD KEYCHAIN_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY; do
          test -n "${!name}" || { echo "Missing required secret: $name"; exit 1; }
        done
        case "$API_BASE_URL" in
          https://*/*) echo "IOS_API_BASE_URL must not include a path or trailing slash."; exit 1 ;;
          https://*) ;;
          *) echo "IOS_API_BASE_URL must be a production HTTPS origin."; exit 1 ;;
        esac
        [[ "$GOOGLE_CLIENT_ID" != *YOUR_* ]] || exit 1
        [[ "$GOOGLE_REVERSED_CLIENT_ID" == com.googleusercontent.apps.* ]] || exit 1
    - name: Run iOS unit tests
      env:
        API_BASE_URL: ${{ secrets.IOS_API_BASE_URL }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_IOS_REVERSED_CLIENT_ID }}
      run: |
        set -euo pipefail
        xcodebuild \
          -project Daily.xcodeproj \
          -scheme Daily \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination '${{ steps.simulator.outputs.destination }}' \
          CODE_SIGNING_ALLOWED=NO \
          API_BASE_URL="$API_BASE_URL" \
          GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
          GOOGLE_REVERSED_CLIENT_ID="$GOOGLE_REVERSED_CLIENT_ID" \
          test
    - name: Test no-mutation release guards
      run: |
        node --test .github/scripts/test-release.test.mjs
        PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_release.py
    - name: Bind release to clean source
      run: |
        set -euo pipefail
        BUILD_NUMBER="$(git rev-list --count HEAD)"
        python3 .github/scripts/verify-release.py prepare-source --sha "$GITHUB_SHA" --build "$BUILD_NUMBER"
        echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
        echo "CI_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
    - name: Prepare existing app-specific authentication
      run: |
        set -euo pipefail
        for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID API_KEY CERT_P12 CERT_PWD KC_PWD; do
          test -n "${!name}" || { echo "Missing existing app-specific configuration: $name"; exit 1; }
        done
        umask 077
        RELEASE_TEMP="$(mktemp -d "$RUNNER_TEMP/native-release.XXXXXX")"
        echo "RELEASE_TEMP=$RELEASE_TEMP" >> "$GITHUB_ENV"
        KEY_PATH="$RELEASE_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
        export KEY_PATH
        python3 - <<'PY'
        import base64, os
        key = os.environ['API_KEY'].strip().replace('\\n', '\n')
        if 'BEGIN PRIVATE KEY' not in key:
            key = base64.b64decode(key).decode()
        if 'BEGIN PRIVATE KEY' not in key:
            raise SystemExit('Existing API key encoding is unsupported.')
        with open(os.environ['KEY_PATH'], 'x') as file:
            file.write(key.rstrip() + '\n')
        PY
        {
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH"
          echo "APP_STORE_CONNECT_KEY_ID=$APP_STORE_CONNECT_KEY_ID"
          echo "APP_STORE_CONNECT_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID"
        } >> "$GITHUB_ENV"
        # altool searches ./private_keys. The directory belongs to this run only.
        mkdir "$RELEASE_TEMP/private_keys"
        ln -s "$KEY_PATH" "$RELEASE_TEMP/private_keys/$(basename "$KEY_PATH")"
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
        CERT_PWD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        KC_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
    - name: Check current app, Jim-only audience and iOS build number
      run: |
        set -euo pipefail
        node .github/scripts/asc-readonly.mjs preflight --sha "$GITHUB_SHA" --build "$IOS_BUILD_NUMBER"
    - name: Import existing signing identity and verify pinned profiles
      run: |
        set -euo pipefail
        umask 077
        KEYCHAIN_PATH="$RELEASE_TEMP/signing.keychain-db"
        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        security list-keychains -d user > "$RELEASE_TEMP/original-keychains.txt"
        security create-keychain -p "$KC_PWD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KC_PWD" "$KEYCHAIN_PATH"
        python3 - "$KEYCHAIN_PATH" "$RELEASE_TEMP/original-keychains.txt" <<'PY'
        import shlex, subprocess, sys
        from pathlib import Path
        subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', sys.argv[1], *shlex.split(Path(sys.argv[2]).read_text())], check=True)
        PY
        printf '%s' "$CERT_P12" | base64 -d > "$RELEASE_TEMP/cert.p12"
        security import "$RELEASE_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PWD" -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PWD" "$KEYCHAIN_PATH" >/dev/null
        security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq '963A7A5107DB8D4C141371C285F71CCAE84A5452'
        security find-certificate -c 'Apple Distribution: James Greco' -p "$KEYCHAIN_PATH" > "$RELEASE_TEMP/certificate.pem"
        openssl x509 -in "$RELEASE_TEMP/certificate.pem" -outform DER -out "$RELEASE_TEMP/certificate.der"
        mkdir "$RELEASE_TEMP/profiles"
        node .github/scripts/asc-readonly.mjs profiles --certificate-der "$RELEASE_TEMP/certificate.der" --directory "$RELEASE_TEMP/profiles"
        python3 .github/scripts/verify-release.py profiles --directory "$RELEASE_TEMP/profiles" --certificate-der "$RELEASE_TEMP/certificate.der" --destination "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
      env:
        CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
        CERT_PWD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        KC_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
    - name: Archive iOS using only verified existing profiles
      run: |
        set -euo pipefail
        test "$API_BASE_URL" = "https://ritualcue.com"
        test -n "$GOOGLE_CLIENT_ID"
        test -n "$GOOGLE_REVERSED_CLIENT_ID"
        python3 .github/scripts/verify-release.py source --sha "$GITHUB_SHA" --build "$IOS_BUILD_NUMBER"
        xcodebuild archive \
          -project "Daily.xcodeproj" \
          -scheme "Daily" \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath "$RELEASE_TEMP/App.xcarchive" \
          DEVELOPMENT_TEAM=V6JPQCD336 \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY=963A7A5107DB8D4C141371C285F71CCAE84A5452 \
          CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
          OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
          IOS_PROFILE_NAME="12917070-3f51-46ec-9b10-0ff1c2228163" \
          IOS_WIDGET_PROFILE_NAME="6e9eb6c7-4440-460f-8683-60e884b2a051" \
          GIT_COMMIT_HASH="${GITHUB_SHA:0:7}" \
          API_BASE_URL="$API_BASE_URL" \
          GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
          GOOGLE_REVERSED_CLIENT_ID="$GOOGLE_REVERSED_CLIENT_ID"
      env:
        API_BASE_URL: ${{ secrets.IOS_API_BASE_URL }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_IOS_REVERSED_CLIENT_ID }}
    - name: Export internal-only IPA without provisioning updates
      run: |
        set -euo pipefail
        python3 .github/scripts/verify-release.py export-options --output "$RELEASE_TEMP/ExportOptions.plist"
        xcodebuild -exportArchive -archivePath "$RELEASE_TEMP/App.xcarchive" -exportOptionsPlist "$RELEASE_TEMP/ExportOptions.plist" -exportPath "$RELEASE_TEMP/export"
        python3 - <<'PY'
        import os
        from pathlib import Path
        files = list((Path(os.environ['RELEASE_TEMP'])/'export').glob('*.ipa'))
        if len(files) != 1:
            raise SystemExit('Expected exactly one exported iOS IPA.')
        with open(os.environ['GITHUB_ENV'], 'a') as file:
            file.write('IPA_PATH=' + str(files[0]) + '\n')
        PY
    - name: Verify signed artifact and recheck current Apple scope
      run: |
        set -euo pipefail
        python3 .github/scripts/verify-release.py artifact --ipa "$IPA_PATH" --sha "$GITHUB_SHA" --build "$IOS_BUILD_NUMBER"
        # Recheck revocation/profile state immediately before the only Apple write.
        mkdir "$RELEASE_TEMP/final-profiles"
        node .github/scripts/asc-readonly.mjs profiles --certificate-der "$RELEASE_TEMP/certificate.der" --directory "$RELEASE_TEMP/final-profiles"
        for path in "$RELEASE_TEMP/profiles/"*.mobileprovision; do
          cmp "$path" "$RELEASE_TEMP/final-profiles/$(basename "$path")"
        done
        node .github/scripts/asc-readonly.mjs preflight --sha "$GITHUB_SHA" --build "$IOS_BUILD_NUMBER"
    - name: Upload one verified iOS build to existing TestFlight app
      run: |
        set -euo pipefail
        cd "$RELEASE_TEMP"
        xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$RELEASE_TEMP/upload.log"
        if grep -Eiq 'UPLOAD FAILED|Validation failed|Failed to upload package' "$RELEASE_TEMP/upload.log"; then exit 1; fi
        grep -Eiq 'UPLOAD SUCCEEDED|successfully uploaded' "$RELEASE_TEMP/upload.log"
    - name: Verify processing and approved internal group availability
      run: |
        set -euo pipefail
        node .github/scripts/asc-readonly.mjs verify-upload --sha "$GITHUB_SHA" --build "$IOS_BUILD_NUMBER"
    - name: Clean only this run signing files
      run: |
        set -euo pipefail
        if [ -n "${RELEASE_TEMP:-}" ]; then
          if [ -f "$RELEASE_TEMP/original-keychains.txt" ]; then
            python3 - "$RELEASE_TEMP/original-keychains.txt" <<'PY'
        import shlex, subprocess, sys
        from pathlib import Path
        subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(Path(sys.argv[1]).read_text())], check=True)
        PY
          fi
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH"; fi
          rm -f "$RELEASE_TEMP/cert.p12" "$RELEASE_TEMP"/AuthKey_*.p8
        fi
      if: always()
